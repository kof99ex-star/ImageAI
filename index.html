sc.background=cl(0);sc.fog=new THREE.Fog(cl(0),110,360);og.color.copy(cl(2)).multiplyScalar(.82);cm.color.copy(cl(1));hemi.color.copy(cl(1));hemi.groundColor.copy(cl(2));hemi.intensity=nm(3);dir.color.copy(cl(4));dir.intensity=nm(5);glow.intensity=nm(6);gm.color.copy(cl(2));
$("#tv").textContent=String(Math.floor(h)).padStart(2,"0")+":"+String(Math.floor(h%1*60)).padStart(2,"0");$("#tr").value=h;
document.querySelectorAll("#tg button").forEach(b=>{const t=+b.dataset.h;b.classList.toggle("cur",Math.abs(((h-t+36)%24)-12)>8.5)})}
function stepW(dt){return w=>{w.s+=w.v*dt;if(w.s>w.len||w.s<0){w.v=-w.v;w.s=Math.min(w.len,Math.max(0,w.s))}let k=1;while(k<w.L.length-1&&w.s>w.L[k])k++;const f=(w.s-w.L[k-1])/(w.L[k]-w.L[k-1]),p=w.pts[k-1],q=w.pts[k],sg=w.v>0?1:-1;w.g.position.set(p[0]+(q[0]-p[0])*f,.16+Math.abs(Math.sin(w.ph+w.s*5))*.08,p[1]+(q[1]-p[1])*f);w.g.rotation.y=Math.atan2((q[0]-p[0])*sg,(q[1]-p[1])*sg)}}

if(ren){home();setH(12);
function fit(){const w=st.clientWidth,h=st.clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(fit).observe(st);
(function tick(){const dt=Math.min(clk.getDelta(),.1);if(!paused){if(playing){H=(H+dt*.6)%24;setH(H)}walkers.forEach(stepW(dt));clouds.forEach(c=>{c.position.x+=c.userData.v*dt;if(c.position.x>170)c.position.x=-170})}
if(fly){const d=fly.clone().sub(ctl.target).multiplyScalar(Math.min(1,dt*4));ctl.target.add(d);cam.position.add(d);if(d.length()<.02)fly=null}
if(eagle)eagle.rotation.y=Math.atan2(cam.position.x-eagle.position.x,cam.position.z-eagle.position.z);ctl.update();ren.render(sc,cam);const w=st.clientWidth,h=st.clientHeight;hs.forEach(o=>{const v=o.p.clone().project(cam);o.el.style.display=v.z<1?"":"none";o.el.style.left=(v.x*.5+.5)*w+"px";o.el.style.top=(-v.y*.5+.5)*h+"px"});requestAnimationFrame(tick)})();
const tg=(id,fn)=>{$(id).onclick=e=>{const b=e.currentTarget,on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);fn(on)}};
$("#rs").onclick=()=>{home();back();filt(null);document.querySelectorAll("details.th").forEach(x=>x.open=false)};
$("#ls").onclick=()=>document.body.classList.toggle("nopanel");
tg("#tp",on=>{home(on);clouds.forEach(c=>c.visible=!on)});tg("#tm",on=>{$("#tpn").hidden=!on});tg("#nm",on=>hs.forEach(o=>o.el.classList.toggle("hide",!on)));tg("#pp",on=>walkers.forEach(w=>w.g.visible=on));
tg("#pz",on=>{paused=on;$("#pz").textContent=on?"繼續":"暫停"});
tg("#hp",on=>{$("#hpc").hidden=!on});
$("#pl").onclick=()=>{playing=!playing;$("#pl").textContent=playing?"❚❚":"▶"};
$("#tr").oninput=e=>{H=+e.target.value;setH(H)};
$("#tg").onclick=e=>{const b=e.target.closest("button");if(b){playing=false;$("#pl").textContent="▶";H=+b.dataset.h;setH(H)}};
ov.addEventListener("click",e=>{const g=e.target.closest(".hs");if(g)open(all.find(i=>i.id===g.dataset.id))})}

// search
const kw={法會:"rite",車位:"pa",停車:"pa",交通:"bus",時間:"hours",電話:"contact",地址:"contact",廁所:"paper"};
$("#q").oninput=e=>{const v=e.target.value.trim(),r=$("#sr");if(!v){r.hidden=true;$("#themes").hidden=false;return}
let m=all.filter(i=>(i.n+i.d+i.th).includes(v));
Object.keys(kw).forEach(k=>{if(v.includes(k)||k.includes(v)){const x=all.find(i=>i.id===kw[k]);if(x&&!m.includes(x))m.push(x)}});
r.innerHTML=m.length?m.map(i=>`<button data-k="${all.indexOf(i)}">${i.n}<small>${i.th}</small></button>`).join(""):`<div style="padding:12px 4px;color:var(--mut)">找不到「${v.replace(/</g,"")}」，可改搜尋「法會」或「開放時間」。</div>`;r.hidden=false;$("#themes").hidden=true};
$("#sr").onclick=e=>{const b=e.target.closest("button");if(b)open(all[b.dataset.k])};
</script>
</body>
</html>
