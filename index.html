<style>

.grp{display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--card);box-shadow:0 6px 22px rgba(0,0,0,.22)}
.grp button{border:0;background:none;color:var(--mut);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}

.rt{right:14px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:8px;background:none;box-shadow:none}

.dpad{left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,46px);gap:4px;background:none;box-shadow:none}.dpad button{height:46px;border:0;border-radius:12px;background:var(--card);color:var(--ink);font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.25);touch-action:none}.dpad[hidden]{display:none}.grp button[hidden]{display:none}
.tpn[hidden],.hp[hidden]{display:none}
.hs{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:opacity .2s}
.hs span{font:500 13px "Noto Sans TC",sans-serif;color:#23332E;background:rgba(255,255,255,.96);border-radius:999px;padding:3px 12px 3px 8px;box-shadow:0 2px 10px rgba(0,0,0,.25);white-space:nowrap}
.hs b{font:500 10px ui-monospace,monospace;color:#E0622D;margin-right:6px}
.hs i{width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--ac);animation:p 2.4s infinite}
.hs:hover span,.hs.on span,.hs:focus-visible span{background:#23332E;color:#fff}
.hs.dim{opacity:.25}.hs.hide span{display:none}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(224,98,45,.6)}70%,100%{box-shadow:0 0 0 12px rgba(224,98,45,0)}}
@media(prefers-reduced-motion:reduce){.hs i{animation:none}}

details.th ul{list-style:none;margin:0 0 14px;padding:0 0 0 48px}
details.th li button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;cursor:pointer}
details.th li button:hover{background:var(--card);color:var(--ac)}
#sr button{display:block;width:100%;text-align:left;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;cursor:pointer}
#sr small{color:var(--mut);margin-left:8px}
#vd{display:none}
#pn.det #vl{display:none}#pn.det #vd{display:block}
.bk{border:0;background:none;color:var(--green);font:inherit;cursor:pointer;padding:0 0 10px}
.tag{color:var(--ac);font-size:14px}

.ph{height:130px;border-radius:12px;margin:14px 0;background:linear-gradient(135deg,var(--green),var(--gold));opacity:.85;display:flex;align-items:end;padding:10px 12px;color:#fff;font-size:13px}
.cta{display:inline-block;margin-top:8px;padding:11px 18px;border-radius:10px;background:var(--green);color:#fff;border:0;font:inherit;cursor:pointer;text-decoration:none}
.cta.alt{background:none;color:var(--green);border:1px solid var(--green);margin-left:8px}
.src{padding:10px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--mut);font-size:12px;line-height:1.6}
@media(max-width:760px){

const AU={};let aOn=false,nextBowl=0;
function aInit(){if(AU.c)return;const c=AU.c=new(window.AudioContext||window.webkitAudioContext)();AU.m=c.createGain();AU.m.gain.value=0;AU.m.connect(c.destination);
const nb=w=>{const b=c.createBuffer(1,c.sampleRate*4,c.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){const x=Math.random()*2-1;if(w){d[i]=x}else{l=(l+.02*x)/1.02;d[i]=l*3.5}}return b};
const mk=(buf,type,f,q)=>{const s=c.createBufferSource();s.buffer=buf;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(AU.m);s.start();return g};
AU.w=mk(nb(0),"lowpass",350,.2);AU.r=mk(nb(1),"bandpass",1800,.7);
const lf=c.createOscillator(),lg=c.createGain();lf.frequency.value=.06;lg.gain.value=.015;lf.connect(lg);lg.connect(AU.w.gain);lf.start();
const co=c.createOscillator(),cg=c.createGain(),cl=c.createOscillator(),cd=c.createGain();co.frequency.value=4300;cl.type="square";cl.frequency.value=16;cd.gain.value=.5;cg.gain.value=.5;cl.connect(cd);cd.connect(cg.gain);AU.k=c.createGain();AU.k.gain.value=0;co.connect(cg);cg.connect(AU.k);AU.k.connect(AU.m);co.start();cl.start()}
function bowl(f,v){const c=AU.c,t=c.currentTime;[[1,1],[2.76,.45],[5.4,.2]].forEach(([r,a])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f*r;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*a,t+.02);g.gain.exponentialRampToValueAtTime(.0005,t+7);o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+7.2)})}
function bird(){const c=AU.c,t=c.currentTime,n=2+Math.floor(Math.random()*3),f=2200+Math.random()*1800;for(let i=0;i<n;i++){const o=c.createOscillator(),g=c.createGain(),s=t+i*.13;o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(f*(1.2+Math.random()*.4),s+.09);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.12,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.1);o.connect(g);g.connect(AU.m);o.start(s);o.stop(s+.12)}}
function aMix(){if(!AU.c||!aOn)return;const h=H,t=AU.c.currentTime,day=h>=6&&h<17.5,dusk=h>=17.5&&h<19.5,night=!day&&!dusk;
AU.w.gain.setTargetAtTime(night?.025:.04,t,2);AU.r.gain.setTargetAtTime(night?.05:.02,t,2);AU.k.gain.setTargetAtTime(night?.05:dusk?.02:0,t,2);
if(Math.random()<(day?.6:dusk?.15:0))bird();
if(Date.now()>nextBowl){bowl(dusk?196:260,dusk?.3:.22);nextBowl=Date.now()+60000+Math.random()*60000}}
